<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar sticky">
        <div class="logo">
            MyWebsite
        </div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><label for="cart-checkbox" class="cart-toggle">🛒 Cart</label></li>
        </ul>
    </nav>
    <div class="hero-image">
        <div class="hero-text">
            <h1>This is </h1>
            <p>And I'm a Photographer</p>
            <button>Hire me</button>
        </div>
    </div>
    <div class="container product">

        <div class="product-box">
            <div class="product-image">
                <img src="./images/images.png" alt="Product 1">
            </div>

            <div class="product-info">
                <h2>Product 1</h2>
                <p>$29.99</p>
            </div>
        </div>

        <div class="product-box">
            <div class="product-image">
                <img src="./images/images.png" alt="Product 2">
            </div>

            <div class="product-info">
                <h2>Product 2</h2>
                <p>$39.99</p>
            </div>
        </div>

        <div class="product-box">
            <div class="product-image">
                <img src="./images/images.png" alt="Product 3">
            </div>

            <div class="product-info">
                <h2>Product 3</h2>
                <p>$49.99</p>
            </div>
        </div>

    </div>

    <div class="cart">
        <input type="checkbox" id="cart-checkbox" class="cart-checkbox">
        <label for="cart-checkbox" class="cart-overlay"></label>
        <aside class="cart-panel">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <label for="cart-checkbox" class="cart-close">&times;</label>
            </div>
            <div class="cart-items">
                <p>Your cart is empty.</p>
            </div>
        </aside>
    </div>

</body>
</html>
